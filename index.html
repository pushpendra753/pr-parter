<style>

  body{background:#050508;font-family:'Nunito','Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;}
  #root{height:100%;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#25253F;outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#FF4500,#FF8C00);cursor:pointer;box-shadow:0 2px 8px rgba(255,69,0,0.4);}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#FF4500,#FF8C00);cursor:pointer;border:none;}
  ::-webkit-scrollbar{width:0px;}
  ::selection{background:rgba(255,69,0,0.3);}
</style>
</head>

/* ─── SVG ICONS ─── */

const IcoX        =({s=18,c=C.muted})=><Icon size={s} color={c} d={["M18 6L6 18","M6 6l12 12"]}/>;
const IcoBack     =({s=18,c=C.muted})=><Icon size={s} color={c} d="M19 12H5M12 19l-7-7 7-7"/>;

const IcoFile     =({s=18,c=C.muted})=><Icon size={s} color={c} d={["M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z","M14 2v6h6","M16 13H8","M16 17H8","M10 9H8"]}/>;
const IcoSettings =({s=18,c=C.muted})=><Icon size={s} color={c} d={["M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z","M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"]}/>;
const IcoTrend    =({s=18,c=C.muted})=><Icon size={s} color={c} d={["M23 6l-9.5 9.5-5-5L1 18","M17 6h6v6"]}/>;

const IcoWallet   =({s=18,c=C.muted})=><Icon size={s} color={c} d={["M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z","M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"]}/>;
const IcoAward    =({s=18,c=C.muted})=><Icon size={s} color={c} d={["M12 15a7 7 0 1 0 0-14 7 7 0 0 0 0 14z","M8.21 13.89L7 23l5-3 5 3-1.21-9.12"]}/>;
const IcoBuild    =({s=18,c=C.muted})=><Icon size={s} color={c} d={["M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z","M9 22V12h6v10"]}/>;
const IcoActivity =({s=18,c=C.muted})=><Icon size={s} color={c} d="M22 12h-4l-3 9L9 3l-3 9H2"/>;

const IcoShield   =({s=18,c=C.muted})=><Icon size={s} color={c} d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>;
const IcoChevron  =({s=18,c=C.muted})=><Icon size={s} color={c} d="M9 18l6-6-6-6"/>;
const IcoLogout   =({s=18,c=C.muted})=><Icon size={s} color={c} d={["M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4","M16 17l5-5-5-5","M21 12H9"]}/>;
const IcoNav      =({s=18,c=C.muted})=><Icon size={s} color={c} d="M3 11l19-9-9 19-2-8-8-2z"/>;
const IcoClock    =({s=18,c=C.muted})=><Icon size={s} color={c} d={["M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z","M12 6v6l4 2"]}/>;
const IcoPlus     =({s=18,c=C.muted})=><Icon size={s} color={c} d={["M12 5v14","M5 12h14"]}/>;

/* ─── SHARED COMPONENTS ─── */
function Btn({label,onClick,v="primary",size="md",disabled=false,style={},children}){
  const sz={sm:{p:"7px 13px",fs:12,r:9},md:{p:"11px 20px",fs:14,r:13},lg:{p:"14px 22px",fs:15,r:14}}[size];
  const vs={
    primary:{background:C.grad,color:"#fff",boxShadow:"0 4px 18px rgba(255,69,0,0.35)",border:"none"},
    secondary:{background:C.card2,color:C.text,border:`1px solid ${C.border}`},
    ghost:{background:"transparent",color:C.p,border:`1px solid ${C.p}`},
    success:{background:"linear-gradient(135deg,#00C853,#00E676)",color:"#fff",border:"none",boxShadow:"0 4px 14px rgba(0,200,83,0.3)"},
    danger:{background:"linear-gradient(135deg,#FF3D00,#FF6D00)",color:"#fff",border:"none"},
    warn:{background:"linear-gradient(135deg,#F57F17,#FFD600)",color:"#000",border:"none"},
  }[v]||{background:C.grad,color:"#fff",border:"none"};
  return(
    <button onClick={disabled?undefined:onClick} disabled={disabled}
      style={{padding:sz.p,fontSize:sz.fs,borderRadius:sz.r,cursor:disabled?"not-allowed":"pointer",
        fontFamily:C.font,fontWeight:700,letterSpacing:"0.3px",display:"flex",alignItems:"center",
        justifyContent:"center",gap:6,opacity:disabled?0.45:1,transition:"all 0.15s",...vs,...style}}>
      {children||label}
    </button>
  );
}

function Badge({label,color}){
  return <span style={{background:`${color}22`,color,border:`1px solid ${color}44`,borderRadius:8,
    padding:"3px 9px",fontSize:11,fontWeight:700,fontFamily:C.font,whiteSpace:"nowrap"}}>{label}</span>;
}

function Card({children,style={},onClick}){
  return <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:18,padding:16,...style}} onClick={onClick}>{children}</div>;
}

function StatCard({label,value,Icon,color,sub}){
  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:"14px",flex:1,minWidth:0}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
        <div style={{background:`${color}18`,borderRadius:10,width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <Icon s={18} c={color}/>
        </div>
        {sub&&<span style={{fontSize:11,color:C.success,fontWeight:700}}>{sub}</span>}
      </div>
      <div style={{fontSize:24,fontWeight:700,color:C.text,fontFamily:C.font,lineHeight:1.1}}>{value}</div>
      <div style={{fontSize:12,color:C.muted,marginTop:4}}>{label}</div>
    </div>
  );
}

function TopBar({title,subtitle,onBack,rightEl}){
  return(
    <div style={{background:C.bg,paddingTop:48,paddingBottom:13,paddingLeft:18,paddingRight:18,borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:11}}>
        {onBack&&(
          <button onClick={onBack} style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:12,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
            <IcoBack s={17} c={C.text}/>
          </button>
        )}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:18,fontWeight:700,color:C.text,fontFamily:C.font}}>{title}</div>
          {subtitle&&<div style={{fontSize:12,color:C.muted,marginTop:1}}>{subtitle}</div>}
        </div>
        {rightEl}
      </div>
    </div>
  );
}

function BottomNav({tab,setTab,role}){
  const tabs=role==="admin"
    ?[{id:"home",Ico:IcoHome,label:"Home"},{id:"jobs",Ico:IcoBriefcase,label:"Jobs"},{id:"workers",Ico:IcoUsers,label:"Workers"},{id:"reports",Ico:IcoBar,label:"Reports"}]
    :[{id:"home",Ico:IcoHome,label:"Home"},{id:"jobs",Ico:IcoBriefcase,label:"My Jobs"},{id:"earnings",Ico:IcoWallet,label:"Earnings"},{id:"profile",Ico:IcoAward,label:"Profile"}];
  return(
    <div style={{position:'fixed',bottom:0,left:0,right:0,width:'100%',background:C.card,borderTop:`1px solid ${C.border}`,display:"flex",paddingBottom:14,paddingTop:10,flexShrink:0,boxShadow:'0 -14px 30px rgba(0,0,0,0.25)',backdropFilter:'blur(12px)',zIndex:20}}>
      {tabs.map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,paddingTop:2}}>
          <t.Ico s={21} c={tab===t.id?C.p:C.muted}/>
          <span style={{fontSize:10,fontWeight:tab===t.id?700:500,color:tab===t.id?C.p:C.muted,fontFamily:C.font}}>{t.label}</span>
          {tab===t.id&&<div style={{width:16,height:3,background:C.p,borderRadius:2}}/>}
        </button>
      ))}
    </div>
  );
}

function Toggle({on,onToggle,label,sub,activeColor}){
  const col=activeColor||(on?C.p:C.card2);
  return(
    <div onClick={onToggle} style={{background:C.card,border:`1.5px solid ${on?col:C.border}`,borderRadius:14,padding:"13px 15px",display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",transition:"border-color 0.2s"}}>
      <div>
        <div style={{fontSize:14,fontWeight:700,color:on?col:C.text,fontFamily:C.font}}>{label}</div>
        {sub&&<div style={{fontSize:11,color:C.muted}}>{sub}</div>}
      </div>
      <div style={{width:44,height:24,background:on?col:C.card2,borderRadius:12,border:`2px solid ${on?col:C.border}`,position:"relative",transition:"all 0.2s",flexShrink:0}}>
        <div style={{position:"absolute",top:2,left:on?20:2,width:16,height:16,background:"#fff",borderRadius:"50%",transition:"left 0.2s",boxShadow:"0 2px 6px rgba(0,0,0,0.3)"}}/>
      </div>
    </div>
  );
}

function JobCard({job,onPress}){
  return(
    <Card style={{marginBottom:10,cursor:"pointer"}} onClick={onPress}>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:10}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:15,fontWeight:700,color:C.text,fontFamily:C.font}}>{job.customer}</div>
          <div style={{fontSize:12,color:C.muted,display:"flex",alignItems:"center",gap:4,marginTop:3}}>
            <IcoPin s={11} c={C.muted}/> {job.address}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,marginLeft:8,flexShrink:0}}>
          {job.emergency&&<Badge label="⚡ URGENT" color={C.danger}/>}
          <Badge label={job.status} color={sColor(job.status)}/>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <Badge label={job.problem} color={C.p}/>
          <Badge label={job.type} color={tColor(job.type)}/>
        </div>
        {job.amount>0&&<div style={{fontSize:16,fontWeight:700,color:C.p,fontFamily:C.font}}>₹{job.amount.toLocaleString()}</div>}
      </div>
      {job.worker&&(
        <div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:7}}>
          <IcoWrench s={12} c={C.muted}/>
          <span style={{fontSize:12,color:C.muted}}>Worker: <span style={{color:C.text,fontWeight:600}}>{job.worker}</span></span>
        </div>
      )}
    </Card>
  );
}

/* ═══════════ SPLASH ═══════════ */
function Splash(){
  const[prog,setProg]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setProg(p=>Math.min(p+3,100)),80);return()=>clearInterval(t);},[]);
  return(
    <div style={{height:"100%",background:`radial-gradient(circle at 50% 38%,rgba(255,69,0,0.22) 0%,${C.bg} 65%)`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden"}}>
      {[300,220,140].map((s,i)=>(
        <div key={i} style={{position:"absolute",top:`${-10-i*8}%`,right:`${-15-i*5}%`,width:s,height:s,border:`1px solid rgba(255,69,0,${0.06+i*0.03})`,borderRadius:"50%",pointerEvents:"none"}}/>
      ))}
      <div style={{position:"absolute",bottom:"-15%",left:"-8%",width:280,height:280,border:"1px solid rgba(255,140,0,0.05)",borderRadius:"50%"}}/>
      {/* Logo */}
      <div style={{width:110,height:110,borderRadius:30,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 20px 60px rgba(255,69,0,0.55),0 0 0 12px rgba(255,69,0,0.08)",marginBottom:28}}>
        <img src="logo.png" alt="PR Partner Logo" style={{width:64,height:64,objectFit:'contain',borderRadius:14}}/>

function BillModal({job,onClose}){
  if(!job) return null;
  const labor = Number(job.estimateLabor||0);
  const material = Number(job.estimateMaterial||0);
  const travel = Number(job.estimateTravel||0);
  const total = labor + material + travel;
  const svcRate = SVC_R[job.type]||0.08;
  const serviceOnWork = Math.round((labor + material) * svcRate);
  const serviceOnTravel = Math.round(travel * 0.08);
  const serviceTotal = serviceOnWork + serviceOnTravel;
  const workerEarning = total - serviceTotal;
  const billText = `BILL SUMMARY\nJob: ${job.id}\nCustomer: ${job.customer}\nAddress: ${job.address}\nProblem: ${job.problem}\n\nLabour: ₹${labor}\nMaterial: ₹${material}\nTravel: ₹${travel}\n\nTotal: ₹${total}\n\nPayment: ${job.paymentType || 'N/A'}\n\n(Worker net: ₹${workerEarning}, App fee hidden: ₹${serviceTotal})`;
  const downloadBill = () => {
    const blob = new Blob([billText], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${job.id}-bill.txt`;
    a.click();
    URL.revokeObjectURL(url);
  };
  return (
    <Modal onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div style={{fontSize:18,fontWeight:800,color:C.text}}>Customer Bill</div>
        <div style={{background:C.card2,borderRadius:14,padding:14,whiteSpace:'pre-wrap',fontFamily:'monospace',fontSize:13,color:C.text}}>{billText}</div>
        <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
          <Btn label="Close" v="secondary" onClick={onClose}/>
          <Btn label="Download PDF" v="primary" onClick={downloadBill}/>
        </div>
      </div>
    </Modal>
  );
}

function WorkerHome({worker,jobs,setJobs,onLogout,onToggleOnline,notification,onAcceptNotification,onRejectNotification,onUpdateJobStatus}){
  const [tab,setTab]=React.useState('home');
  const [selectedJobId,setSelectedJobId]=useState(null);
  const [expandedJobId,setExpandedJobId]=useState(null);
  const [extraWorkNote,setExtraWorkNote]=useState('');
  const [extraWorkPrice,setExtraWorkPrice]=useState('');
  const [extraWorkPhoto,setExtraWorkPhoto]=useState('');
  const [billModalJob,setBillModalJob]=useState(null);
  const myJobs = jobs.filter(j=> j.workerId===worker.id);
  const completedJobs = myJobs.filter(j=> j.status==='Completed');
  const activeJobs = myJobs.filter(j=> j.status!=='Completed');
  const totalEarnings = completedJobs.reduce((sum,j)=>sum + (j.amount||0),0);
  const selectedJob = selectedJobId ? myJobs.find(j=> j.id===selectedJobId) : myJobs[0] || null;

  const updateJob = (jobId, updates) => {
    setJobs(prev=> prev.map(j=> j.id===jobId ? {...j, ...updates} : j));
  };

  const calculateJobTotals = (job) => {
    const labor = Number(job.estimateLabor || 0);
    const material = Number(job.estimateMaterial || 0);
    const travel = Number(job.estimateTravel || 0);
    const total = labor + material + travel;
    const svcRate = SVC_R[job.type] || 0.08;
    const serviceOnWork = Math.round((labor + material) * svcRate);
    const serviceOnTravel = Math.round(travel * 0.08);
    const serviceTotal = serviceOnWork + serviceOnTravel;
    const workerTake = total - serviceTotal;
    return {labor, material, travel, total, serviceOnWork, serviceOnTravel, serviceTotal, workerTake};
  };

  const addExtraWork = () => {
    if(!selectedJob) return;
    if(!extraWorkNote || !extraWorkPrice) return alert('Enter extra work description and price');
    const extra = {id:`extra-${Date.now()}`,note:extraWorkNote,price:Number(extraWorkPrice)||0,photo:extraWorkPhoto,approved:false};
    updateJob(selectedJob.id,{extraWorks:[...(selectedJob.extraWorks||[]), extra]});
    setExtraWorkNote(''); setExtraWorkPrice(''); setExtraWorkPhoto('');
  };

  const saveInspection = (job) => {
    if(!job.inspectionNotes && !(job.inspectionPhotos||[]).length) return alert('Add inspection notes or photos');
    updateJob(job.id,{status:'Inspection Done',inspectionAt:Date.now()});
  };

  const sendEstimate = (job) => {
    const totals = calculateJobTotals(job);
    if(totals.total <= 0) return alert('Enter estimate values');
    updateJob(job.id,{status:'Estimate Sent',amount:totals.total,estimateSentAt:Date.now()});
  };

  const approveCustomer = (job) => {
    updateJob(job.id,{status:'Approved',customerSignature:true,approvedAt:Date.now()});
  };

  const startWork = (job) => {
    updateJob(job.id,{status:'Working',workStartedAt:Date.now()});
  };

  const completeWork = (job) => {
    if(!job.completionNotes) return alert('Add completion notes');
    if(!job.paymentType) return alert('Select payment type');
    updateJob(job.id,{status:'Completed',completionAt:Date.now(),paymentReceived:true});
  };

  const verifyCompletion = (job) => {
    updateJob(job.id,{customerSignature:true,verifiedAt:Date.now()});
  };

  const openBillModal = (job) => setBillModalJob(job);
  const closeBillModal = () => setBillModalJob(null);

  const renderNotification = () => {
    if(!notification) return null;
    const job = notification.job;
    const title = worker.role === 'Electrician' ? 'New Electrical Job' : 'New Job Available';
    if(notification.status==='pending'){
      const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(job.address)}`;
      const whatsappUrl = `https://wa.me/${job.phone}`;
      return (
        <Card style={{marginBottom:14,border:`1px solid ${C.p}`}}>
          <div style={{fontSize:15,fontWeight:800,color:C.text,marginBottom:10}}>{title}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
            <Card style={{padding:12}}><div style={{fontSize:12,color:C.muted}}>Area</div><div style={{fontSize:14,color:C.text}}>{job.address}</div></Card>
            <Card style={{padding:12}}><div style={{fontSize:12,color:C.muted}}>Problem</div><div style={{fontSize:14,color:C.text}}>{job.problem}</div></Card>
            <Card style={{padding:12}}><div style={{fontSize:12,color:C.muted}}>Distance</div><div style={{fontSize:14,color:C.text}}>{worker.distance} km</div></Card>
            <Card style={{padding:12}}><div style={{fontSize:12,color:C.muted}}>Estimated earning</div><div style={{fontSize:14,color:C.text}}>₹{job.amount || 0}</div></Card>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>
            <a href={mapUrl} target="_blank" rel="noreferrer" style={{textDecoration:'none'}}><Btn label="Open Map" v="secondary" size="sm"/></a>
            <a href={`tel:${job.phone}`} style={{textDecoration:'none'}}><Btn label="Call Customer" v="secondary" size="sm"/></a>
            <a href={whatsappUrl} target="_blank" rel="noreferrer" style={{textDecoration:'none'}}><Btn label="WhatsApp" v="secondary" size="sm"/></a>
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <Btn label="Reject" v="secondary" size="sm" onClick={()=>onRejectNotification(worker.id, notification.jobId)} />
            <Btn label="Accept" v="primary" size="sm" onClick={()=>onAcceptNotification(worker.id, notification.jobId)} />
          </div>
        </Card>
      );
    }
    if((notification.status==='unavailable' || notification.status==='rejected') && notification.unavailableUntil){
      return (
        <Card style={{marginBottom:14,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:15,fontWeight:800,color:C.text}}>Job unavailable</div>
          <div style={{fontSize:13,color:C.muted,marginTop:8}}>This job will become available again at {new Date(notification.unavailableUntil).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}.</div>
        </Card>
      );
    }
    return null;
  };

  const renderJobDetail = (job) => {
    if(!job) return null;
    const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(job.address)}`;
    const whatsappUrl = `https://wa.me/${job.phone}`;
    const totals = calculateJobTotals(job);
    return (
      <Card style={{marginBottom:14,border: selectedJobId===job.id ? `1px solid ${C.p}` : undefined}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
          <div>
            <div style={{fontSize:16,fontWeight:800,color:C.text}}>{job.customer}</div>
            <div style={{fontSize:13,color:C.muted,marginTop:4}}>{job.problem} • {job.address}</div>
          </div>
          <div style={{textAlign:'right'}}>
            <Badge label={job.status} color={sColor(job.status)} />
            <div style={{fontSize:13,color:C.muted,marginTop:6}}>₹{job.amount || 0}</div>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:10,marginBottom:12}}>
          <Card style={{padding:12}}><div style={{fontSize:12,color:C.muted}}>Worker Role</div><div style={{fontSize:14,color:C.text}}>{worker.role}</div></Card>
          <Card style={{padding:12}}><div style={{fontSize:12,color:C.muted}}>Customer</div><div style={{fontSize:14,color:C.text}}>{job.customer}</div></Card>
          <Card style={{padding:12}}><div style={{fontSize:12,color:C.muted}}>Distance</div><div style={{fontSize:14,color:C.text}}>{worker.distance} km</div></Card>
          <Card style={{padding:12}}><div style={{fontSize:12,color:C.muted}}>Type</div><div style={{fontSize:14,color:C.text}}>{job.type}</div></Card>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>
          <a href={mapUrl} target="_blank" rel="noreferrer" style={{textDecoration:'none'}}><Btn label="Open Map" v="secondary" size="sm"/></a>
          <a href={`tel:${job.phone}`} style={{textDecoration:'none'}}><Btn label="Call Customer" v="secondary" size="sm"/></a>
          <a href={whatsappUrl} target="_blank" rel="noreferrer" style={{textDecoration:'none'}}><Btn label="WhatsApp" v="secondary" size="sm"/></a>
        </div>
        {job.status==='Assigned' && (
          <div style={{display:'flex',justifyContent:'flex-end'}}><Btn label="On The Way" v="primary" size="sm" onClick={()=>onUpdateJobStatus(job.id,'On The Way')} /></div>
        )}
        {job.status==='On The Way' && (
          <div style={{display:'flex',justifyContent:'flex-end'}}><Btn label="Reached" v="primary" size="sm" onClick={()=>onUpdateJobStatus(job.id,'Reached')} /></div>
        )}
        {job.status==='Reached' && (
          <div style={{display:'grid',gap:10,marginTop:12}}>
            <div style={{fontSize:14,fontWeight:700,color:C.text}}>Inspection Mode</div>
            <textarea value={job.inspectionNotes||''} onChange={e=>updateJob(job.id,{inspectionNotes:e.target.value})} placeholder="Inspection notes" style={{minHeight:100,padding:12,borderRadius:14,border:`1px solid ${C.border}`,background:C.card2,color:C.text}} />
            <label style={{fontSize:12,color:C.muted}}>Upload photos</label>
            <input type="file" multiple onChange={e=>updateJob(job.id,{inspectionPhotos:Array.from(e.target.files).map(file=>file.name)})} style={{color:C.text}} />
            <Btn label="Save Inspection" v="primary" size="sm" onClick={()=>saveInspection(job)} />
          </div>
        )}
        {job.status==='Inspection Done' && (
          <div style={{display:'grid',gap:12,marginTop:12}}>
            <div style={{fontSize:14,fontWeight:700,color:C.text}}>Estimate Generator</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <input value={job.estimateLabor||''} onChange={e=>updateJob(job.id,{estimateLabor:e.target.value})} placeholder="Labour / work" style={{padding:12,borderRadius:14,border:`1px solid ${C.border}`,background:C.card2,color:C.text}} />
              <input value={job.estimateMaterial||''} onChange={e=>updateJob(job.id,{estimateMaterial:e.target.value})} placeholder="Material (optional)" style={{padding:12,borderRadius:14,border:`1px solid ${C.border}`,background:C.card2,color:C.text}} />
              <input value={job.estimateTravel||''} onChange={e=>updateJob(job.id,{estimateTravel:e.target.value})} placeholder="Travel charge" style={{padding:12,borderRadius:14,border:`1px solid ${C.border}`,background:C.card2,color:C.text}} />
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:C.muted}}>
              <div>Suggested total</div><div>₹{totals.total}</div>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:C.muted}}>
              <div>Hidden app charge</div><div>₹{totals.serviceTotal}</div>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:C.success}}>
              <div>Worker net</div><div>₹{totals.workerTake}</div>
            </div>
            <Btn label="Send Estimate" v="primary" size="sm" onClick={()=>sendEstimate(job)} />
          </div>
        )}
        {job.status==='Estimate Sent' && (
          <Card style={{background:C.card2,padding:12,borderRadius:14,marginTop:12}}>
            <div style={{fontSize:14,fontWeight:700,color:C.text}}>Waiting Approval</div>
            <div style={{fontSize:12,color:C.muted,marginTop:6}}>Please get customer approval and signature before starting work.</div>
            <Btn label="Customer Signed" v="primary" size="sm" style={{marginTop:10}} onClick={()=>approveCustomer(job)} />
          </Card>
        )}
        {job.status==='Approved' && (
          <div style={{display:'flex',justifyContent:'flex-end',marginTop:12}}><Btn label="Start Work" v="primary" size="sm" onClick={()=>startWork(job)} /></div>
        )}
        {job.status==='Working' && (
          <div style={{display:'grid',gap:12,marginTop:12}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontSize:14,fontWeight:700,color:C.text}}>Extra Work</div>
              <div style={{fontSize:12,color:C.muted}}>Approval required</div>
            </div>
            <input value={extraWorkNote} onChange={e=>setExtraWorkNote(e.target.value)} placeholder="Extra work description" style={{padding:12,borderRadius:14,border:`1px solid ${C.border}`,background:C.card2,color:C.text}} />
            <input value={extraWorkPrice} onChange={e=>setExtraWorkPrice(e.target.value)} placeholder="Extra work price" style={{padding:12,borderRadius:14,border:`1px solid ${C.border}`,background:C.card2,color:C.text}} />
            <input value={extraWorkPhoto} onChange={e=>setExtraWorkPhoto(e.target.value)} placeholder="Photo note or file name" style={{padding:12,borderRadius:14,border:`1px solid ${C.border}`,background:C.card2,color:C.text}} />
            <Btn label="Add Extra Work" v="secondary" size="sm" onClick={addExtraWork} />
            {(job.extraWorks||[]).length>0 && (job.extraWorks||[]).map(extra=> (
              <Card key={extra.id} style={{padding:12,background:C.card2}}>
                <div style={{fontSize:13,color:C.text,fontWeight:700}}>{extra.note}</div>
                <div style={{fontSize:12,color:C.muted}}>Price: ₹{extra.price}</div>
                <div style={{fontSize:12,color:C.muted}}>Photo: {extra.photo || 'N/A'}</div>
                <div style={{fontSize:12,color:extra.approved?C.success:C.warn}}>{extra.approved ? 'Approved' : 'Pending approval'}</div>
              </Card>
            ))}
            <div style={{fontSize:14,fontWeight:700,color:C.text}}>Completion</div>
            <label style={{fontSize:12,color:C.muted}}>Upload completion photos</label>
            <input type="file" multiple onChange={e=>updateJob(job.id,{completionPhotos:Array.from(e.target.files).map(file=>file.name)})} style={{color:C.text}} />
            <textarea value={job.completionNotes||''} onChange={e=>updateJob(job.id,{completionNotes:e.target.value})} placeholder="Final notes" style={{minHeight:100,padding:12,borderRadius:14,border:`1px solid ${C.border}`,background:C.card2,color:C.text}} />
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <select value={job.paymentType||''} onChange={e=>updateJob(job.id,{paymentType:e.target.value})} style={{padding:12,borderRadius:14,border:`1px solid ${C.border}`,background:C.card2,color:C.text}}>
                <option value="">Payment type</option>
                <option value="Cash">Cash</option>
                <option value="Online">Online</option>
              </select>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <input type="checkbox" checked={!!job.paymentReceived} onChange={e=>updateJob(job.id,{paymentReceived:e.target.checked})} />
                <span style={{color:C.muted,fontSize:12}}>Payment received</span>
              </div>
            </div>
            {job.paymentType==='Online' && <div style={{background:C.card2,borderRadius:14,padding:12,fontSize:12,color:C.muted}}>Show company QR or URL to customer.</div>}
            <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
              <Btn label="Verify Customer Signature" v="secondary" size="sm" onClick={()=>verifyCompletion(job)} />
              <Btn label="Complete Work" v="primary" size="sm" onClick={()=>completeWork(job)} />
            </div>
          </div>
        )}
        {job.status==='Completed' && (
          <div style={{display:'grid',gap:10,marginTop:12}}>
            <div style={{fontSize:14,fontWeight:700,color:C.text}}>Complete Job Summary</div>
            <div style={{fontSize:13,color:C.muted}}>Final amount: ₹{job.amount || 0}</div>
            <div style={{fontSize:13,color:C.muted}}>Payment type: {job.paymentType || 'N/A'}</div>
            <div style={{fontSize:13,color:C.muted}}>Customer signed: {job.customerSignature ? 'Yes' : 'No'}</div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:C.muted}}>
              <div>Hidden app fee</div><div>₹{totals.serviceTotal}</div>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:C.success}}>
              <div>Worker net</div><div>₹{totals.workerTake}</div>
            </div>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
              <Btn label="View Bill" v="secondary" size="sm" onClick={()=>openBillModal(job)} />
              <Btn label="Share PDF" v="primary" size="sm" onClick={()=>openBillModal(job)} />
            </div>
          </div>
        )}
      </Card>
    );
  };

  const nextJobAction = (status) => {
    if(status==='Assigned') return {label:'On The Way', next:'On The Way'};
    if(status==='On The Way') return {label:'Reached', next:'Reached'};
    if(status==='Reached') return {label:'Start Work', next:'Working'};
    if(status==='Working') return {label:'Complete', next:'Completed'};
    return null;
  };

  const renderHome = () => (
    <>
      <div style={{display:'flex',gap:12,marginBottom:12}}>
        <StatCard label="Assigned Jobs" value={myJobs.length} Icon={IcoBriefcase} color={C.p} sub={`${activeJobs.length} active`} />
        <StatCard label="Completed" value={completedJobs.length} Icon={IcoAward} color={C.success} sub={`Rating ${worker.rating}`} />
      </div>
      <div style={{marginBottom:10}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div style={{fontSize:15,fontWeight:800,color:C.text,fontFamily:C.font}}>Recent Jobs</div>
          <Badge label={worker.online? 'Online':'Offline'} color={worker.online?C.success:C.muted} />
        </div>
        {myJobs.length===0 ? <Card style={{textAlign:'center',padding:18,color:C.muted}}>No jobs assigned yet.</Card> : myJobs.slice(0,3).map(j=> <JobCard key={j.id} job={j} onPress={()=>alert(`Job ${j.id}: ${j.customer}`)}/>)}
      </div>
      <div>
        <div style={{fontSize:15,fontWeight:800,color:C.text,fontFamily:C.font,marginBottom:8}}>Quick Summary</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:10}}>
          <Card style={{display:'flex',flexDirection:'column',gap:8}}>
            <div style={{fontSize:13,color:C.muted}}>Total Earnings</div>
            <div style={{fontSize:18,fontWeight:700,color:C.text}}>₹{totalEarnings}</div>
          </Card>
          <Card style={{display:'flex',flexDirection:'column',gap:8}}>
            <div style={{fontSize:13,color:C.muted}}>Worker Code</div>
            <div style={{fontSize:18,fontWeight:700,color:C.text}}>{worker.code}</div>
          </Card>
        </div>
      </div>
    </>
  );

  const renderMyJobs = () => (
    <>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <div>
          <div style={{fontSize:18,fontWeight:800,color:C.text,fontFamily:C.font}}>My Jobs</div>
          <div style={{fontSize:12,color:C.muted}}>{myJobs.length} assigned jobs</div>
        </div>
        <Badge label={worker.online? 'Online':'Offline'} color={worker.online?C.success:C.muted} />
      </div>
      {myJobs.length===0 ? <Card style={{textAlign:'center',padding:18,color:C.muted}}>No jobs assigned yet.</Card> : myJobs.map(j=> (
        <Card key={j.id} style={{marginBottom:10,border:selectedJobId===j.id?`1px solid ${C.p}`:undefined}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10,cursor:'pointer'}} onClick={()=>setSelectedJobId(j.id)}>
            <div style={{minWidth:0}}>
              <div style={{fontSize:15,fontWeight:700,color:C.text,fontFamily:C.font}}>{j.customer}</div>
              <div style={{fontSize:12,color:C.muted,display:'flex',alignItems:'center',gap:4,marginTop:3}}>{j.address}</div>
            </div>
            <div style={{textAlign:'right',display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
              <div style={{fontSize:13,fontWeight:700,color:C.text}}>₹{j.amount || 0}</div>
              <div style={{fontSize:12,color:C.muted}}>{j.type}</div>
              <button onClick={(e)=>{e.stopPropagation(); setExpandedJobId(expandedJobId===j.id?null:j.id);}} style={{background:'transparent',border:'none',color:C.p,cursor:'pointer',fontSize:12,padding:6}}>{expandedJobId===j.id ? 'Minimize' : 'Maximize'}</button>
            </div>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <Badge label={j.status} color={sColor(j.status)} />
            <Badge label={tColor(j.type)} color={tColor(j.type)} />
          </div>
          {expandedJobId===j.id && (
            <div style={{marginTop:10,padding:12,background:C.card2,borderRadius:14}}>
              <div style={{fontSize:13,color:C.muted,marginBottom:6}}>Problem</div>
              <div style={{fontSize:14,color:C.text,marginBottom:10}}>{j.problem}</div>
              <div style={{display:'flex',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
                <div style={{fontSize:12,color:C.muted}}>Area</div><div style={{fontSize:12,color:C.text}}>{j.address}</div>
                <div style={{fontSize:12,color:C.muted}}>Type</div><div style={{fontSize:12,color:C.text}}>{j.type}</div>
              </div>
            </div>
          )}
          {(() => {
            const action = nextJobAction(j.status);
            return action ? (
              <div style={{marginTop:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:12,color:C.muted}}>Tap to view details</span>
                <Btn label={action.label} v="primary" size="sm" onClick={(e)=>{e.stopPropagation(); onUpdateJobStatus(j.id, action.next);}} />
              </div>
            ) : null;
          })()}
        </Card>
      ))}
    </>
  );

  const renderEarnings = () => (
    <>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:10,marginBottom:12}}>
        <StatCard label="Total Earnings" value={`₹${totalEarnings}`} Icon={IcoWallet} color={C.p} />
        <StatCard label="Completed Jobs" value={completedJobs.length} Icon={IcoCheck} color={C.success} />
      </div>
      <Card style={{marginBottom:12}}>
        <div style={{fontSize:15,fontWeight:800,color:C.text,fontFamily:C.font,marginBottom:8}}>Earnings Breakdown</div>
        {completedJobs.length===0 ? <div style={{color:C.muted,fontSize:13}}>No completed jobs yet.</div> : completedJobs.map(j=> (
          <div key={j.id} style={{display:'flex',justifyContent:'space-between',gap:10,padding:'10px 0',borderTop:`1px solid ${C.border}`}}>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:C.text}}>{j.customer}</div>
              <div style={{fontSize:12,color:C.muted}}>{j.problem}</div>
            </div>
            <div style={{fontSize:14,fontWeight:700,color:C.text}}>₹{j.amount || 0}</div>
          </div>
        ))}
      </Card>
      <div style={{display:'flex',gap:10}}>
        <Card style={{flex:1,display:'flex',flexDirection:'column',gap:6}}>
          <div style={{fontSize:13,color:C.muted}}>Average per job</div>
          <div style={{fontSize:18,fontWeight:700,color:C.text}}>₹{completedJobs.length ? Math.round(totalEarnings / completedJobs.length) : 0}</div>
        </Card>
        <Card style={{flex:1,display:'flex',flexDirection:'column',gap:6}}>
          <div style={{fontSize:13,color:C.muted}}>Active jobs</div>
          <div style={{fontSize:18,fontWeight:700,color:C.text}}>{activeJobs.length}</div>
        </Card>
      </div>
    </>
  );

  const renderProfile = () => (
    <>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div>
          <div style={{fontSize:18,fontWeight:800,color:C.text,fontFamily:C.font}}>{worker.name}</div>
          <div style={{fontSize:13,color:C.muted}}>{worker.code}</div>
        </div>
        <Badge label={worker.online? 'Online':'Offline'} color={worker.online?C.success:C.muted} />
      </div>
      <Card style={{marginBottom:12}}>
        <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:8}}>About</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div style={{fontSize:13,color:C.muted}}>Role</div><div style={{fontSize:13,color:C.text}}>{worker.role}</div>
          <div style={{fontSize:13,color:C.muted}}>Phone</div><div style={{fontSize:13,color:C.text}}>{worker.phone}</div>
          <div style={{fontSize:13,color:C.muted}}>Jobs Completed</div><div style={{fontSize:13,color:C.text}}>{worker.jobs}</div>
          <div style={{fontSize:13,color:C.muted}}>Rating</div><div style={{fontSize:13,color:C.text}}>{worker.rating} / 5</div>
        </div>
      </Card>
      <Card>
        <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:8}}>Actions</div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <Btn label="Call Support" v="secondary" size="sm" onClick={()=>window.location.href=`tel:${worker.phone}`} />
          <Btn label={worker.online ? 'Go Offline' : 'Go Online'} v="primary" size="sm" onClick={()=>onToggleOnline(worker.id)} />
        </div>
      </Card>
    </>
  );

  const renderContent = () => {
    if(tab==='jobs') return renderMyJobs();
    if(tab==='earnings') return renderEarnings();
    if(tab==='profile') return renderProfile();
    return renderHome();
  };

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',minHeight:'100vh',paddingBottom:88}}>
      <TopBar title={`${worker.name} / ${worker.code}`} subtitle={`${myJobs.length} assigned`} rightEl={
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button onClick={()=>onToggleOnline(worker.id)} style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:12,width:38,height:38,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
            <IcoWifi c={worker.online?C.success:C.muted}/>
          </button>
          <Btn v="ghost" size="sm" onClick={onLogout}><IcoLogout c={C.muted}/></Btn>
        </div>
      } />
      <div style={{padding:14,flex:1,overflowY:'auto'}}>
        {renderNotification()}
        {selectedJob && renderJobDetail(selectedJob)}
        {renderContent()}
      </div>
      <BottomNav tab={tab} setTab={setTab} role="worker"/>
      {billModalJob && <BillModal job={billModalJob} onClose={closeBillModal} />}
    </div>
  );
}

</html>
